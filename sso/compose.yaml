services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - edge

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: keycloak
    # journald so the dockerz Wazuh agent (which reads journald) ships these logs; tag = container name.
    # `docker logs` still works with this driver.
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    restart: unless-stopped
    command: start
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      # TLS terminates at nginx (matches homepage/portainer pattern) - Keycloak
      # serves plain HTTP internally but must know its real external hostname
      # for correct SAML/OIDC issuer URLs and redirect validation.
      - KC_HOSTNAME=${SSO_HOSTNAME}
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      # CVE-2026-114938 (Java4Shell) mitigation until the image ships a patched JDK
      - JAVA_OPTS_APPEND=-XX:-UseBASE64Intrinsics
      # Log successful login/register/etc. events too (default: only errors, at WARN), for Wazuh
      - KC_SPI_EVENTS_LISTENER__JBOSS_LOGGING__SUCCESS_LEVEL=info
    depends_on:
      - keycloak-db
    networks:
      - edge

networks:
  edge:
    name: edge
    external: true

volumes:
  keycloak_db_data:
