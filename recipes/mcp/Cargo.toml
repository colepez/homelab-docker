[package]
name = "recipes-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server exposing a Mealie recipe library to Claude"

[dependencies]
rmcp = { version = "3.9", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-util = "0.7"
axum = "0.8"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
strip = true
