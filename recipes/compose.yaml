# Recipes: Mealie (recipe manager) plus recipes-mcp, a small Rust MCP server that lets Claude read/write recipes.
# Public hostname comes from stack env; the Cloudflare tunnel routes it straight to mealie:9000 (no nginx hop),
# and the MCP path to recipes-mcp. Data lives under the private /srv/docker tree, so the hourly rsync backs it up.
services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.30.0
    container_name: mealie
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - TZ=${TZ}
      - BASE_URL=${RECIPES_BASE_URL}
      - ALLOW_SIGNUP=false
      - DB_ENGINE=sqlite
      - MAX_WORKERS=1
      - WEB_CONCURRENCY=1
      # Sign-in via Keycloak (realm homelab, client "mealie"). Realm roles arrive as the "groups" claim:
      # mealie-users may sign in, mealie-admins are Mealie admins. Users are matched to existing accounts by email.
      # Password login stays configurable as a break-glass; the recipes-mcp API token works either way.
      - OIDC_AUTH_ENABLED=true
      - OIDC_SIGNUP_ENABLED=true
      - OIDC_CONFIGURATION_URL=${RECIPES_OIDC_CONFIGURATION_URL}
      - OIDC_CLIENT_ID=mealie
      - OIDC_CLIENT_SECRET=${RECIPES_OIDC_CLIENT_SECRET}
      - OIDC_USER_GROUP=mealie-users
      - OIDC_ADMIN_GROUP=mealie-admins
      - OIDC_GROUPS_CLAIM=groups
      - OIDC_PROVIDER_NAME=Homelab SSO
      - OIDC_REMEMBER_ME=true
      - OIDC_AUTO_REDIRECT=${RECIPES_OIDC_AUTO_REDIRECT:-false}
      - ALLOW_PASSWORD_LOGIN=${RECIPES_ALLOW_PASSWORD_LOGIN:-true}
    volumes:
      - ${RECIPES_DATA_PATH}:/app/data
    networks:
      - edge

  # MCP endpoint for Claude (claude.ai custom connector). Source in ./mcp. The tunnel routes <RECIPES_BASE_URL>/mcp and
  # /.well-known/oauth-protected-resource here. Auth is OAuth via the SSO realm (Keycloak client claude-mcp): tokens
  # must carry audience recipes-mcp and realm role mealie-users or mealie-admins.
  recipes-mcp:
    build: ./mcp
    image: recipes-mcp:local
    pull_policy: build
    container_name: recipes-mcp
    restart: unless-stopped
    init: true
    mem_limit: 128m
    environment:
      - RECIPES_BASE_URL=${RECIPES_BASE_URL}
      - MCP_OIDC_ISSUER=${RECIPES_MCP_OIDC_ISSUER}
      - MCP_OIDC_JWKS_URL=http://keycloak:8080/realms/homelab/protocol/openid-connect/certs
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS}
      - MEALIE_API_TOKEN=${MEALIE_API_TOKEN}
      - MEALIE_URL=http://mealie:9000
    depends_on:
      - mealie
    networks:
      - edge

networks:
  edge:
    name: edge
    external: true
