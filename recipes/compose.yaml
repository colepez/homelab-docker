# Recipes: Mealie (recipe manager) plus recipes-mcp, a small Rust MCP server that lets Claude read/write recipes.
# Public hostname comes from stack env; the Cloudflare tunnel routes it straight to mealie:9000 (no nginx hop),
# and the MCP path to recipes-mcp. Data lives under the private /srv/docker tree, so the hourly rsync backs it up.
services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.31.0
    container_name: mealie
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - TZ=${TZ}
      - BASE_URL=${RECIPES_BASE_URL}
      - ALLOW_SIGNUP=false
      - DB_ENGINE=sqlite
      - MAX_WORKERS=1
      - WEB_CONCURRENCY=1
      # Sign-in via Keycloak (realm homelab, client "mealie"). Realm roles arrive as the "groups" claim:
      # mealie-users may sign in, mealie-admins are Mealie admins. Users are matched to existing accounts by email.
      # Password login stays configurable as a break-glass.
      - OIDC_AUTH_ENABLED=true
      - OIDC_SIGNUP_ENABLED=true
      - OIDC_CONFIGURATION_URL=${RECIPES_OIDC_CONFIGURATION_URL}
      - OIDC_CLIENT_ID=mealie
      - OIDC_CLIENT_SECRET=${RECIPES_OIDC_CLIENT_SECRET}
      - OIDC_USER_GROUP=mealie-users
      - OIDC_ADMIN_GROUP=mealie-admins
      - OIDC_GROUPS_CLAIM=groups
      - OIDC_PROVIDER_NAME=Homelab SSO
      - OIDC_REMEMBER_ME=true
      - OIDC_AUTO_REDIRECT=${RECIPES_OIDC_AUTO_REDIRECT:-false}
      - ALLOW_PASSWORD_LOGIN=${RECIPES_ALLOW_PASSWORD_LOGIN:-true}
      # recipes-mcp acts as the signed-in user via Mealie's reverse-proxy login: it sends the Keycloak-verified username
      # plus this shared secret to /api/auth/reverse-proxy. No signup through it (users are created by their SSO login).
      # The tunnel 404s that path for public traffic; only recipes-mcp on the internal network reaches it.
      - REVERSE_PROXY_AUTH_ENABLED=true
      - REVERSE_PROXY_AUTH_SIGNUP_ENABLED=false
      - REVERSE_PROXY_AUTH_SECRET=${RECIPES_REVERSE_PROXY_SECRET}
      # Mealie logs all settings at startup and only hides a few, so secrets like OIDC_CLIENT_SECRET and
      # REVERSE_PROXY_AUTH_SECRET would land in mealie.log and the container log. This logging config (from the
      # private tree) is Mealie's production config plus a filter that redacts *SECRET/*PASSWORD/*TOKEN/*API_KEY values.
      - LOG_CONFIG_OVERRIDE=/opt/homelab-logconf/logconf.json
      - PYTHONPATH=/opt/homelab-logconf
    volumes:
      - ${RECIPES_DATA_PATH}:/app/data
      - ${RECIPES_LOGCONF_PATH}:/opt/homelab-logconf:ro
    networks:
      - edge

  # MCP endpoint for Claude (claude.ai custom connector). Source in ./mcp. The tunnel routes <RECIPES_BASE_URL>/mcp and
  # /.well-known/oauth-protected-resource here. Auth is OAuth via the SSO realm (Keycloak client claude-mcp): tokens
  # must carry audience recipes-mcp and realm role mealie-users or mealie-admins.
  recipes-mcp:
    build: ./mcp
    image: recipes-mcp:local
    pull_policy: build
    container_name: recipes-mcp
    restart: unless-stopped
    init: true
    mem_limit: 128m
    environment:
      - RECIPES_BASE_URL=${RECIPES_BASE_URL}
      - MCP_OIDC_ISSUER=${RECIPES_MCP_OIDC_ISSUER}
      - MCP_OIDC_JWKS_URL=http://keycloak:8080/realms/homelab/protocol/openid-connect/certs
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS}
      - MEALIE_REVERSE_PROXY_SECRET=${RECIPES_REVERSE_PROXY_SECRET}
      - MEALIE_URL=http://mealie:9000
    depends_on:
      - mealie
    networks:
      - edge

  # Invite-link sign-up page (source in ./join). The tunnel routes <RECIPES_BASE_URL>/join/* here. Creates Keycloak users
  # only as members of group Mealie, through service account mealie-join whose sole power is a fine-grained admin
  # permission on that group; Keycloak emails the set-password link. Invites are made with the CLI:
  #   docker exec recipes-join recipes-join new --days 7 --uses 10 --note "..."   (also: list, revoke <id>)
  # Codes are stored hashed in the data dir. Each sign-up pings a Home Assistant webhook (local-only) for a phone push.
  recipes-join:
    build: ./join
    image: recipes-join:local
    pull_policy: build
    container_name: recipes-join
    restart: unless-stopped
    init: true
    mem_limit: 64m
    environment:
      - PUBLIC_URL=${RECIPES_BASE_URL}
      - KC_URL=http://keycloak:8080
      - KC_REALM=homelab
      - KC_CLIENT_ID=mealie-join
      - KC_CLIENT_SECRET=${RECIPES_JOIN_KC_SECRET}
      - KC_GROUP=/Mealie
      - NOTIFY_URL=${RECIPES_JOIN_NOTIFY_URL}
      - DATA_DIR=/data
    volumes:
      - ${RECIPES_JOIN_DATA_PATH}:/data
    networks:
      - edge

networks:
  edge:
    name: edge
    external: true
