# homelab-tickets: minimal Rust ticket queue for the Wazuh -> Claude alert responder (source in this directory).
# Built from this repo by Portainer. The hostname/TLS vhost lives in the private repo; secrets come from stack env.
# The UI sits behind Keycloak: nginx auth_request -> tickets-oauth2-proxy (OIDC client in the SSO realm), and the app
# trusts the forwarded user only with the shared TICKETS_PROXY_SECRET. /api/* stays Bearer-token only.
services:
  tickets:
    build: .
    image: homelab-tickets:local
    container_name: tickets
    restart: unless-stopped
    init: true
    environment:
      - TZ=${TZ}
      - TICKETS_API_TOKEN=${TICKETS_API_TOKEN}
      - TICKETS_UI_PASSWORD=${TICKETS_UI_PASSWORD}
      - TICKETS_SESSION_SECRET=${TICKETS_SESSION_SECRET}
      - TICKETS_BASE_URL=${TICKETS_BASE_URL}
      - TICKETS_PROXY_SECRET=${TICKETS_PROXY_SECRET}
    volumes:
      # SQLite lives under the private /srv/docker tree, so the hourly rsync backup picks it up
      - ${TICKETS_DATA_PATH}:/data
    networks:
      - edge

  tickets-oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    container_name: tickets-oauth2-proxy
    restart: unless-stopped
    environment:
      - OAUTH2_PROXY_PROVIDER=keycloak-oidc
      - OAUTH2_PROXY_CLIENT_ID=homelab-tickets
      - OAUTH2_PROXY_CLIENT_SECRET=${TICKETS_OIDC_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${TICKETS_OAUTH2_COOKIE_SECRET}
      - OAUTH2_PROXY_COOKIE_NAME=_tickets_oauth2
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_COOKIE_EXPIRE=168h
      - OAUTH2_PROXY_COOKIE_REFRESH=1h
      - OAUTH2_PROXY_REDIRECT_URL=${TICKETS_BASE_URL}/oauth2/callback
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_ALLOWED_ROLES=tickets-admins
      # Browser-facing login uses the public SSO URL. Server-to-server calls go straight to the keycloak container,
      # because the public hostname is not reachable from containers. Tokens fetched that way carry the
      # request-derived issuer, so issuer-string verification is skipped; signatures are still checked via JWKS.
      - OAUTH2_PROXY_OIDC_ISSUER_URL=${TICKETS_OIDC_ISSUER_URL}
      - OAUTH2_PROXY_SKIP_OIDC_DISCOVERY=true
      - OAUTH2_PROXY_INSECURE_OIDC_SKIP_ISSUER_VERIFICATION=true
      - OAUTH2_PROXY_LOGIN_URL=${TICKETS_OIDC_ISSUER_URL}/protocol/openid-connect/auth
      - OAUTH2_PROXY_REDEEM_URL=http://keycloak:8080/realms/homelab/protocol/openid-connect/token
      - OAUTH2_PROXY_OIDC_JWKS_URL=http://keycloak:8080/realms/homelab/protocol/openid-connect/certs
      - OAUTH2_PROXY_PROFILE_URL=http://keycloak:8080/realms/homelab/protocol/openid-connect/userinfo
      - OAUTH2_PROXY_VALIDATE_URL=http://keycloak:8080/realms/homelab/protocol/openid-connect/userinfo
      - OAUTH2_PROXY_CODE_CHALLENGE_METHOD=S256
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_UPSTREAMS=static://202
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      - OAUTH2_PROXY_WHITELIST_DOMAINS=${TICKETS_OIDC_WHITELIST_DOMAIN}
    networks:
      - edge

networks:
  edge:
    name: edge
    external: true
