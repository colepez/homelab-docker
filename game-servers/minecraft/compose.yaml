services:
  router:
    image: itzg/mc-router
    restart: unless-stopped
    environment:
      IN_DOCKER: true
      # enabled 2026-08-19: the router-wide switch was previously off, which
      # meant auto-scale-down never actually ran for any backend - including
      # atm10, whose mc-router.auto-scale-down label only takes effect once
      # this global flag is also on. Now on for all three servers so idle
      # backends stop after AUTO_SCALE_DOWN_AFTER instead of staying up 24/7.
      AUTO_SCALE_DOWN: true
      AUTO_SCALE_UP: true
      AUTO_SCALE_DOWN_AFTER: 2h
      AUTO_SCALE_ASLEEP_MOTD: "Server is asleep. Join again to wake it up!"
      API_BINDING: ":8080"
      METRICS_BACKEND: prometheus
      RECORD_LOGINS: true
    # mc-router's image moved to a non-root distroless user (uid 65532) at
    # some point without a version bump on the "latest" tag - it needs the
    # host's docker group to actually read/write the socket mounted below
    group_add:
      - "${DOCKER_GID:-988}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
  zinnberlycraft:
    image: itzg/minecraft-server:latest
    environment:
      EULA: "TRUE"
      # Fabric adds BlueMap for the live map; it's server-side only so
      # vanilla clients still connect exactly as before.
      TYPE: FABRIC
      VERSION: "26.2"
      VIEW_DISTANCE: "12"
      MOTD: "§l§cWelcome§r to our §aAwesome§r Server"
    volumes:
      - /srv/docker/game-servers/minecraft/zinnberlycraft/data:/data
    restart: unless-stopped
    labels:
      mc-router.host: "${ZINNBERLYCRAFT_HOST}"
    networks:
      - edge
  foreverworld:
    image: itzg/minecraft-server
    environment:
      EULA: "TRUE"
      MOTD: "${FOREVERWORLD_MOTD}"
      SIMULATION_DISTANCE: "12"
      VIEW_DISTANCE: "12"
      VERSION: "26.2"
      difficulty: "normal"
    labels:
      mc-router.host: "${FOREVERWORLD_HOST}"
    volumes:
      - /srv/docker/game-servers/minecraft/forever/data:/data
    networks:
      - edge
    restart: unless-stopped
  # atm10:
  #   # ATM10 targets MC 1.21 / NeoForge, which wants Java 21
  #   image: itzg/minecraft-server:java21
  #   environment:
  #     EULA: "TRUE"
  #     TYPE: CURSEFORGE
  #     # pre-downloaded server-pack zip, placed directly in this service's
  #     # data dir (bind-mounted below) - no CurseForge API key needed for
  #     # this path (that's only required by the AUTO_CURSEFORGE fetch-by-URL
  #     # platform type, which this isn't using)
  #     CF_SERVER_MOD: ServerFiles-7.1.zip
  #     SEED: "1568897881445927183"
  #     MOTD: "${ATM10_MOTD}"
  #     VIEW_DISTANCE: "10"
  #     DIFFICULTY: "normal"
  #     ALLOW_FLIGHT: "TRUE"
  #     MEMORY: "8G"
  #     USE_AIKAR_FLAGS: "TRUE"
  #     MAX_TICK_TIME: "-1"
  #   mem_limit: 10g
  #   labels:
  #     mc-router.host: "${ATM10_HOST}"
  #     mc-router.auto-scale-down: "true"
  #   volumes:
  #     - /srv/docker/game-servers/minecraft/atm10/data:/data
  #   restart: unless-stopped
  #   networks:
  #     - edge
  # Commented out 2026-08-22, per Cole - dockerz was under real memory
  # pressure (swap actively in use) running both atm10 and the new
  # aeronautics server at once, each with a 10g limit. Data left on disk
  # untouched at atm10/data - just uncomment this block and redeploy to
  # bring it back.
  aeronautics:
    # All the Mods 10: Aeronautics - NeoForge / MC 1.21.1, same java21 base
    # image as atm10. This pack has no dedicated server-file download (unlike
    # atm10's ServerFiles-7.1.zip), so it's fetched via AUTO_CURSEFORGE
    # (CF_SLUG) instead - itzg's image builds the server pack itself from the
    # client modpack manifest using Cole's CurseForge API key, mounted as the
    # cf_api_key docker secret defined at the bottom of this file.
    image: itzg/minecraft-server:java21
    environment:
      EULA: "TRUE"
      TYPE: AUTO_CURSEFORGE
      CF_SLUG: all-the-mods-10-aeronautics
      CF_API_KEY_FILE: /run/secrets/cf_api_key
      MOTD: "${AERONAUTICS_MOTD}"
      VIEW_DISTANCE: "10"
      DIFFICULTY: "normal"
      ALLOW_FLIGHT: "TRUE"
      MEMORY: "12G"
      USE_AIKAR_FLAGS: "TRUE"
      MAX_TICK_TIME: "-1"
      # Lets `docker exec ... mc-send-to-console` issue in-game/console
      # commands (used for the Chunky pregen) without needing RCON.
      CREATE_CONSOLE_IN_PIPE: "true"
    # Bumped 8G/10g -> 10G/12g -> 12G/14g, 2026-08-22 - was still sitting at
    # ~96% of the 10G/12g bump with zero players online (flat, not still
    # climbing - more likely the JVM just not returning committed heap to
    # the OS than an active leak, but very little real headroom either way).
    # dockerz's balloon was also nudged (disabled, qm set 105 --balloon 0)
    # to unlock its full configured 28GB so this bump has room.
    mem_limit: 14g
    # Excludes core 0, 2026-08-22 - that core is reserved exclusively for
    # transmission (see media/compose.yaml) after this server's Chunky
    # pregen load coincided with a genuine transmission RPC-hang crash.
    # cpuset only controls what THIS container can use, so it's the pairing
    # of this exclusion with transmission's cpuset: "0" that actually keeps
    # them off each other, not either one alone.
    cpuset: "1-11"
    secrets:
      - cf_api_key
    labels:
      mc-router.host: "${AERONAUTICS_HOST}"
      # router-wide AUTO_SCALE_DOWN is off (see router service comment) -
      # override it on just this container so it sleeps after 2h idle,
      # matching atm10's setup - this one has real memory headroom stakes.
      mc-router.auto-scale-down: "true"
    volumes:
      - /srv/docker/game-servers/minecraft/aeronautics/data:/data
    restart: unless-stopped
    networks:
      - edge
