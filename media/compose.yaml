services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${MULLVAD_WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${MULLVAD_WIREGUARD_ADDRESSES}
      - SERVER_CITIES=${MULLVAD_SERVER_CITIES}
    networks:
      - edge

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PEERPORT=${TRANSMISSION_PEER_PORT}
    volumes:
      - /srv/docker/media/transmission/data:/config
      # Active downloads (both incomplete-dir and download-dir, set via
      # Transmission's own settings.json, not here) now go straight to
      # /mnt/media/downloads-staging - a dedicated ZFS dataset on TrueNAS
      # (atime=off, sync=disabled, recordsize=64K) mounted with
      # noac/actimeo=0. This replaced local-disk staging on 2026-08-17.
      # The original local-disk move (comment removed) was a workaround for
      # an NFS read-after-write cache-consistency bug that made piece
      # verification silently fail forever. That bug's root cause was never
      # found; this migration proceeded anyway per explicit direction after
      # the risk was disclosed. A real, reproducible full-daemon hang (RPC
      # unresponsive, unkillable, required a forced NFS unmount to recover)
      # was hit once during testing on this same tuned config - see
      # scripts/transmission-watchdog.sh, which auto-recovers via the same
      # forced-unmount sequence if it happens again in production.
      # downloads-local kept mounted as a fallback path, not actively used.
      - /srv/docker/media/downloads-local:/downloads
      - /mnt/media:/mnt/media

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /srv/docker/media/prowlarr/data:/config
    networks:
      - edge

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /srv/docker/media/sonarr/data:/config
      # Same mounts as transmission at the same container paths, so Sonarr
      # can see files at whatever path transmission reports (now
      # /mnt/media/downloads-staging - see transmission's own volume
      # comment above). downloads-local kept as an unused fallback.
      - /srv/docker/media/downloads-local:/downloads
      - /mnt/media:/mnt/media
    networks:
      - edge

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /srv/docker/media/radarr/data:/config
      # Same mounts as transmission at the same container paths, so Radarr
      # can see files at whatever path transmission reports (now
      # /mnt/media/downloads-staging - see transmission's own volume
      # comment above). downloads-local kept as an unused fallback.
      - /srv/docker/media/downloads-local:/downloads
      - /mnt/media:/mnt/media
    networks:
      - edge

  # plex: migrated 2026-08-17 to a dedicated LXC (10.21.2.68) on wontwon for
  # real NVIDIA GPU passthrough (RTX 3060 Ti) - not possible for a container
  # inside this VM without full VM-level PCI passthrough, which would have
  # made the GPU exclusive to this VM instead of shareable. See
  # scripts/README.md and the LXC's own /srv/plex/compose/compose.yaml.
  # Old config data intentionally left in place at
  # /srv/docker/media/plex/data as a safety net, not deleted.
  # plex:
  #   image: lscr.io/linuxserver/plex:latest
  #   container_name: plex
  #   restart: unless-stopped
  #   environment:
  #     - PUID=${PUID}
  #     - PGID=${PGID}
  #     - TZ=${TZ}
  #     - PLEX_CLAIM=${PLEX_CLAIM}
  #     - VERSION=docker
  #   volumes:
  #     - /srv/docker/media/plex/data:/config
  #     - /srv/docker/media/plex/transcode:/transcode
  #     - /mnt/media:/mnt/media
  #   networks:
  #     - edge

networks:
  edge:
    name: edge
    external: true
