services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - TZ=${TZ}
      # Switched from Mullvad to Proton VPN 2026-08-20, per Cole - Proton
      # supports port forwarding (Mullvad discontinued it in 2023), which
      # matters for torrent swarm connectivity. Using VPN_SERVICE_PROVIDER=
      # custom with an explicit endpoint/public key (rather than gluetun's
      # native protonvpn provider mode) so it connects to the exact server
      # Cole selected in the Proton app, not one gluetun picks itself.
      # Old MULLVAD_* vars are left in Portainer's env store, unused, as a
      # rollback path - not deleted.
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTON_WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${PROTON_WIREGUARD_ADDRESSES}
      - WIREGUARD_PUBLIC_KEY=${PROTON_WIREGUARD_PUBLIC_KEY}
      - WIREGUARD_ENDPOINT_IP=${PROTON_WIREGUARD_ENDPOINT_IP}
      - WIREGUARD_ENDPOINT_PORT=${PROTON_WIREGUARD_ENDPOINT_PORT}
    networks:
      - edge

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PEERPORT=${TRANSMISSION_PEER_PORT}
    volumes:
      - /srv/docker/media/transmission/data:/config
      # Active downloads (both incomplete-dir and download-dir, set via
      # Transmission's own settings.json, not here) go to
      # /mnt/media/downloads-staging and /mnt/media/downloads-complete -
      # dedicated ZFS datasets on TrueNAS (atime=off, sync=disabled) so a
      # completed download lands via one clean sequential write instead of
      # accumulating COW fragmentation from in-place torrent piece writes.
      # First attempted 2026-08-17, reverted to local-disk staging after a
      # real, reproducible full-daemon hang (RPC unresponsive, unkillable,
      # required a forced NFS unmount to recover - see
      # scripts/transmission-watchdog.sh, which auto-recovers via the same
      # sequence if it happens again). Retried 2026-08-18 after fixing the
      # two things that likely caused that: the local disk had also been
      # completely full at the time, and Transmission's preallocation was
      # set to "fast" (now "none") - full/fast preallocation over NFS can
      # force real extra write I/O rather than a cheap sparse allocation.
      # The NFS mount itself uses plain defaults, not noac/actimeo=0.
      # downloads-local kept mounted as a fallback path, not actively used.
      - /srv/docker/media/downloads-local:/downloads
      - /mnt/media:/mnt/media
    labels:
      - autoheal=true
    healthcheck:
      # Added 2026-08-19 after a recurring failure mode where the daemon's
      # process died in a way Docker's own restart:unless-stopped policy
      # never noticed (docker ps kept showing "Up" for over an hour on a
      # stale/reused PID - docker restart/kill/rm -f all failed with "tried
      # to kill container, but did not receive an exit event"). A real HTTP
      # healthcheck plus the autoheal sidecar below is what actually
      # recovers from this, since the native restart policy only fires on
      # a clean process exit. Accepts any real HTTP response (including the
      # normal 409 CSRF-required response) as evidence the daemon is alive -
      # a fixed 200-only check would false-positive-fail on a healthy RPC.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9091/transmission/rpc | grep -qv '^000$'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /srv/docker/media/prowlarr/data:/config
    networks:
      - edge

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /srv/docker/media/sonarr/data:/config
      # Same mounts as transmission at the same container paths, so Sonarr
      # can see files at whatever path transmission reports (now
      # /mnt/media/downloads-staging - see transmission's own volume
      # comment above). downloads-local kept as an unused fallback.
      - /srv/docker/media/downloads-local:/downloads
      - /mnt/media:/mnt/media
    networks:
      - edge
    labels:
      - autoheal=true
    healthcheck:
      # Same recurring zombie-daemon failure mode as transmission (see its
      # healthcheck comment above) hit Sonarr too. /ping is Sonarr's own
      # unauthenticated liveness endpoint - no API key needed here.
      test: ["CMD-SHELL", "curl -sf http://localhost:8989/ping -o /dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /srv/docker/media/radarr/data:/config
      # Same mounts as transmission at the same container paths, so Radarr
      # can see files at whatever path transmission reports (now
      # /mnt/media/downloads-staging - see transmission's own volume
      # comment above). downloads-local kept as an unused fallback.
      - /srv/docker/media/downloads-local:/downloads
      - /mnt/media:/mnt/media
    networks:
      - edge
    labels:
      - autoheal=true
    healthcheck:
      # Same recurring zombie-daemon failure mode as transmission/sonarr
      # (see transmission's healthcheck comment above) hit Radarr too.
      # /ping is Radarr's own unauthenticated liveness endpoint.
      test: ["CMD-SHELL", "curl -sf http://localhost:7878/ping -o /dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    restart: unless-stopped
    environment:
      - PORT=11011
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /srv/docker/media/cleanuparr/data:/config
      # Same paths as transmission/sonarr/radarr (see transmission's own
      # volume comment above) - orphaned-files scanning needs to see the
      # actual download directories, not just talk to the API.
      - /srv/docker/media/downloads-local:/downloads
      - /mnt/media:/mnt/media
    networks:
      - edge
    # Connects to Sonarr/Radarr (http://sonarr:8989, http://radarr:7878)
    # and Transmission (http://gluetun:9091 - transmission itself has no
    # network of its own, see network_mode above) via its own web UI after
    # first boot, not via env vars here.
    labels:
      - autoheal=true
    healthcheck:
      # No known unauthenticated liveness endpoint for cleanuparr - just
      # confirms its web server answers at all (any real HTTP status, not
      # a connection failure), same pattern as transmission's check above.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:11011/ | grep -qv '^000$'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  autoheal:
    # Added 2026-08-19 alongside the healthchecks above. A Docker
    # HEALTHCHECK marks a container "unhealthy" but does NOT restart it on
    # its own - restart:unless-stopped only fires on a clean process exit,
    # which is exactly what didn't happen in tonight's incident. Autoheal
    # watches for the unhealthy status and issues the restart. Scoped via
    # AUTOHEAL_CONTAINER_LABEL to only the 4 services labeled autoheal=true
    # above, not every container on the host.
    #
    # This does require read access to the Docker socket, which is
    # effectively host-root-equivalent access - the same tradeoff already
    # accepted for Portainer's own agent on this host, not a new class of
    # risk. Deliberately not using the tecnativa socket-proxy pattern from
    # the Wazuh docker-listener setup here, since that proxy doesn't
    # support scoping the restart operation autoheal needs - only read
    # endpoints are individually toggleable there.
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # plex: migrated 2026-08-17 to a dedicated LXC (10.21.2.68) on wontwon for
  # real NVIDIA GPU passthrough (RTX 3060 Ti) - not possible for a container
  # inside this VM without full VM-level PCI passthrough, which would have
  # made the GPU exclusive to this VM instead of shareable. See
  # scripts/README.md and the LXC's own /srv/plex/compose/compose.yaml.
  # Old config data intentionally left in place at
  # /srv/docker/media/plex/data as a safety net, not deleted.
  # plex:
  #   image: lscr.io/linuxserver/plex:latest
  #   container_name: plex
  #   restart: unless-stopped
  #   environment:
  #     - PUID=${PUID}
  #     - PGID=${PGID}
  #     - TZ=${TZ}
  #     - PLEX_CLAIM=${PLEX_CLAIM}
  #     - VERSION=docker
  #   volumes:
  #     - /srv/docker/media/plex/data:/config
  #     - /srv/docker/media/plex/transcode:/transcode
  #     - /mnt/media:/mnt/media
  #   networks:
  #     - edge

networks:
  edge:
    name: edge
    external: true
